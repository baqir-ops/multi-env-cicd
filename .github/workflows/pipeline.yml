name: Multi-Environment CI/CD Pipeline

on:
  push:
    branches: [dev, staging, main]

jobs:

  # ─── JOB 1: Runs on every branch ───
  test:
    name: Run Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest test_app.py -v

  # ─── JOB 2: Only on staging or main ───
  build-and-push:
    name: Build & Push Docker Image
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            baqirops/multi-env-cicd:latest
            baqirops/multi-env-cicd:${{ github.sha }}

  # ─── JOB 3: Only on main + manual approval ───
  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Pull and run container
        run: |
          docker pull baqirops/multi-env-cicd:latest
          docker stop flask-app || true
          docker rm flask-app || true
          docker run -d \
            --name flask-app \
            --restart always \
            -p 80:5000 \
            -e APP_ENV=production \
            baqirops/multi-env-cicd:latest
          echo "✅ Deployed at $(date)"
          docker ps
